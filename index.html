<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Gas Usage</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title-area">
      <span class="version">b1v2</span>
      <span class="app-title">Gas Usage</span>
    </div>
    <button id="gearButton" class="gear-button" aria-label="Settings">⚙</button>
  </header>

  <main>
    <section id="mainScreen" class="screen">
      <h2>System Lookup Codes</h2>

      <form id="slcForm" novalidate>
        <div class="field">
          <label for="groupCode">Group Code</label>
          <input id="groupCode" maxlength="2" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="order">Order</label>
          <input id="order" type="number" min="1" step="1" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="valueCode">Value Code</label>
          <input id="valueCode" maxlength="2" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="value">Value</label>
          <input id="value" maxlength="10" autocomplete="off" required>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="buttons">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="clearButton">Clear</button>
        </div>
      </form>

      <h3>Saved System Lookup Codes</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SLCId</th>
              <th>Group Code</th>
              <th>Order</th>
              <th>Value Code</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="slcRows"></tbody>
        </table>
      </div>
    </section>

    <section id="gearScreen" class="screen hidden">
      <div class="notice">
        <div class="notice-text">To be implemented.</div>
        <button id="closeGear" class="primary">Close</button>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
