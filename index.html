<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Gas Usage</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=b1v12">
<style id="b1v12-layout-fix">
/* b1v12 layout corrections */
.entry-grid { grid-template-columns: 105px 40px 86px minmax(80px, 1fr) !important; }
.short-input {
  width: 40px !important;
  min-width: 40px !important;
  max-width: 40px !important;
  justify-self: start !important;
}
.value-input {
  width: 80% !important;
  justify-self: start !important;
}
.record-buttons {
  display: flex !important;
  gap: 10px !important;
}
.record-button {
  width: 17px !important;
  min-width: 17px !important;
  max-width: 17px !important;
  height: 15px !important;
  min-height: 15px !important;
  max-height: 15px !important;
  padding: 0 !important;
  font-size: 10px !important;
  line-height: 13px !important;
}
@media (max-width: 620px) {
  .entry-grid { grid-template-columns: 94px 40px 72px minmax(90px, 1fr) !important; }
}
</style>

<style id="b1v12-entry-layout">
/* b1v12: exact entry alignment requested by the user.
   Content starts at the existing 12px main padding.
   Column starts are: label 24px, short boxes 124px, second label 311px,
   second set of boxes 400px on the phone layout. */
.entry-grid {
  display: block !important;
  max-width: none !important;
}
.entry-row {
  display: grid !important;
  grid-template-columns: 88px 40px 123px 77px 40px !important;
  column-gap: 12px !important;
  align-items: center !important;
  margin-bottom: 16px !important;
}
.entry-label {
  font-size: 16px !important;
  line-height: 1.05 !important;
  white-space: nowrap !important;
}
.entry-row input.short-input {
  width: 40px !important;
  min-width: 40px !important;
  max-width: 40px !important;
  height: 38px !important;
  justify-self: start !important;
}
.entry-row input.value-input {
  width: 194px !important;
  min-width: 194px !important;
  max-width: 194px !important;
  height: 38px !important;
  justify-self: start !important;
}
.record-buttons {
  display: flex !important;
  gap: 10px !important;
  margin-top: 10px !important;
}
.record-button {
  width: 17px !important;
  min-width: 17px !important;
  max-width: 17px !important;
  height: 15px !important;
  min-height: 15px !important;
  max-height: 15px !important;
  padding: 0 !important;
  font-size: 10px !important;
  line-height: 13px !important;
}
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title-area">
      <span class="version">b1v12</span>
      <span class="app-title">Gas Usage</span>
    </div>
    <nav class="menu-bar" aria-label="Application menu">
      <div class="menu-area">
        <button id="actionsButton" class="menu-entry" aria-haspopup="true" aria-expanded="false">Actions</button>
        <div id="actionsMenu" class="submenu hidden">
          <button id="importButton" class="submenu-item">Import</button>
          <button id="exportButton" class="submenu-item">Export</button>
        </div>
      </div>
    </nav>
    <button id="gearButton" class="gear-button" aria-label="System Lookup Codes">⚙</button>
  </header>

  <main>
    <section id="mainScreen" class="screen">
      <p class="main-message">Gas usage tracking application</p>
    </section>

    <section id="gearScreen" class="screen hidden">
      <div class="slc-header">
        <h2>System Lookup Codes</h2>
        <button id="closeGear" class="close-button">Close</button>
      </div>

      <form id="slcForm" novalidate>
        <div class="entry-grid">
          <div class="entry-row">
            <div class="entry-label stacked-label">Group<br>Code:</div>
            <input id="groupCode" class="short-input" maxlength="2" autocomplete="off" required>
            <div class="entry-label">Order:</div>
            <input id="order" class="short-input" type="number" min="1" step="1" inputmode="numeric" required>
          </div>

          <div class="entry-row">
            <div class="entry-label stacked-label">Value<br>Code:</div>
            <input id="valueCode" class="short-input" maxlength="2" autocomplete="off" required>
            <div class="entry-label">Value:</div>
            <input id="value" class="value-input" type="text" autocomplete="off" required>
          </div>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="main-buttons">
          <button type="submit" class="action-button">Save</button>
          <button type="button" id="clearButton" class="action-button">Clear</button>
        </div>

        <div class="record-buttons" aria-label="Record actions">
          <button type="button" id="addButton" class="record-button" aria-label="Add">+</button>
          <button type="button" id="deleteButton" class="record-button" aria-label="Delete">-</button>
          <button type="button" id="changeButton" class="record-button" aria-label="Change">•</button>
        </div>
      </form>

      <h3>Saved System Lookup Codes</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="radio-column"></th>
              <th>SLCId</th>
              <th>Group<br>Code</th>
              <th>Order</th>
              <th>Value<br>Code</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="slcRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <input id="jsonFileInput" type="file" accept=".json,application/json" class="hidden">

  <div id="deleteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deletePrompt">
    <div class="modal-box">
      <div id="deletePrompt" class="modal-text">Are you sure that you want to delete this record?</div>
      <div class="modal-buttons">
        <button type="button" id="deleteYes" class="action-button">Yes</button>
        <button type="button" id="deleteNo" class="action-button">No</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
